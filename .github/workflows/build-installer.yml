name: build-installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout(含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------- 1. 编译定制 GUI(x64 + x86,均尽力而为) ----------------
      - name: Build openvpn-gui x64 (best-effort)
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path vcpkg.json) { & "$env:VCPKG_ROOT\vcpkg.exe" x-update-baseline --add-initial-baseline }
          cmake --preset x64
          cmake --build --preset x64-release

      - name: Build openvpn-gui x86 (best-effort)
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --preset x86
          cmake --build --preset x86-release

      # ---------------- 2. OpenVPN 2.6.20 运行时(x64 + x86)+ Wintun ----------------
      # 说明:OpenVPN 2.7 已移除 wintun、改用 win-dco,而 win-dco 不支持
      #       AES-128-CBC(SoftEther 兼容要求),会连不上。故锁定到仍带 wintun 的 2.6.20。
      # 注意:官方 MSI 解包后 bin 里并不带 wintun.dll(2.6 默认走 ovpn-dco-win),
      #       故 wintun 单独从 wintun.net 下载,与核心二进制分别取用。
      - name: Harvest OpenVPN 2.6.20 runtimes (amd64 + x86)
        id: svc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://build.openvpn.net/downloads/releases'
          $ver  = '2.6.20'
          $am64 = "$base/OpenVPN-$ver-I001-amd64.msi"
          $ax86 = "$base/OpenVPN-$ver-I001-x86.msi"

          function Expand-Msi($url, $tag) {
            $msi = "$env:RUNNER_TEMP\ovpn-$tag.msi"
            Write-Host "下载 $url"
            Invoke-WebRequest $url -OutFile $msi
            $ex = "$env:RUNNER_TEMP\ovpn-$tag-extract"
            Start-Process msiexec.exe "/a `"$msi`" /qn TARGETDIR=`"$ex`"" -Wait
            $exe = Get-ChildItem $ex -Recurse -Filter openvpn.exe | Select-Object -First 1
            if (-not $exe) { throw "$tag MSI 解包后找不到 openvpn.exe" }
            # bin 目录(openvpn.exe / openvpnserv.exe 等都在此,wintun 单独取)
            return $exe.Directory.FullName
          }

          $x64Bin = Expand-Msi $am64 'x64'
          $x86Bin = Expand-Msi $ax86 'x86'

          # Wintun(amd64 + x86),单独下载解压
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $zip
          $wintun = "$env:RUNNER_TEMP\wintun"
          Expand-Archive $zip $wintun -Force

          # 交互服务参数:openvpnserv.exe 的标准交互实例参数。
          # 必须用默认实例(不带实例名),否则 named pipe 变成
          # \\.\pipe\openvpn\ovpn\service,而 openvpn.exe/GUI 只认
          # 固定的 \\.\pipe\openvpn\service,连不上服务 → msg_channel=0
          # → 无权创建 wintun 适配器 → "no TAP/Wintun/ovpn-dco adapters"。
          $svc = "-instance interactive"
          Write-Host "ServiceArgs = $svc"

          # 缓存解包结果,供 Assemble 步骤使用
          $x64Bin | Out-File "$env:RUNNER_TEMP\x64Bin.txt" -Encoding utf8
          $x86Bin | Out-File "$env:RUNNER_TEMP\x86Bin.txt" -Encoding utf8
          $wintun | Out-File "$env:RUNNER_TEMP\wintun.txt" -Encoding utf8
          "args=$svc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ---------------- 3. 组装 payload(x64 必做,x86 尽力而为)----------------
      - name: Assemble payload
        id: assemble
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $x64Src = (Get-Content "$env:RUNNER_TEMP\x64Bin.txt" -Raw).Trim()
          $x86Src = (Get-Content "$env:RUNNER_TEMP\x86Bin.txt" -Raw).Trim()
          $wintun = (Get-Content "$env:RUNNER_TEMP\wintun.txt" -Raw).Trim()

          # 内部函数:优先用 CI 编译出来的 GUI 覆盖官方版
          function Use-CustomGui($bin, $arch) {
            $built = Get-ChildItem "out\build\$arch" -Recurse -Filter openvpn-gui.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $built) {
              # 兜底:仓库里预先提交的(installer\gui\<arch>\openvpn-gui.exe)
              if (Test-Path "installer\gui\$arch\openvpn-gui.exe") { $built = Get-Item "installer\gui\$arch\openvpn-gui.exe" }
            }
            if ($built) {
              Copy-Item $built.FullName "$bin\openvpn-gui.exe" -Force
              Write-Host "[OK] $arch 使用 CI 编译的 GUI: $($built.FullName)"
            } else {
              Write-Host "[!] $arch 未找到 CI 编译的 GUI,使用官方版"
            }
          }

          # 内部函数:从 wintun 包里取对应架构的 wintun.dll 放进 bin
          function Add-Wintun($bin, $arch) {
            $pat = if ($arch -eq 'x64') { 'amd64' } else { '\\x86\\' }
            $d = Get-ChildItem $wintun -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match $pat } | Select-Object -First 1
            if (-not $d) { throw "未找到 $arch wintun.dll" }
            Copy-Item $d.FullName "$bin\wintun.dll" -Force
          }

          # ---- x64(必做)----
          $x64 = "installer\payload\x64\bin"
          New-Item -ItemType Directory -Force -Path $x64, "installer\payload\config" | Out-Null
          Copy-Item "$x64Src\*" $x64 -Recurse -Force
          Add-Wintun $x64 "x64"
          Use-CustomGui $x64 "x64"
          foreach ($f in @("openvpn.exe","openvpnserv.exe","wintun.dll","openvpn-gui.exe")) {
            if (-not (Test-Path "$x64\$f")) { throw "x64 payload 缺少 $f" }
          }

          # ---- x86(尽力而为,失败则退回纯 64 位安装包)----
          $haveX86 = "false"
          try {
            $x86 = "installer\payload\x86\bin"
            New-Item -ItemType Directory -Force -Path $x86 | Out-Null
            Copy-Item "$x86Src\*" $x86 -Recurse -Force
            Add-Wintun $x86 "x86"
            Use-CustomGui $x86 "x86"
            foreach ($f in @("openvpn.exe","openvpnserv.exe","wintun.dll","openvpn-gui.exe")) {
              if (-not (Test-Path "$x86\$f")) { throw "x86 payload 缺少 $f" }
            }
            $haveX86 = "true"
            Write-Host "[OK] 32 位 payload 组装完成,将打成 32/64 合一安装包"
          } catch {
            Write-Warning "32 位 payload 组装失败,退回纯 64 位安装包:$($_.Exception.Message)"
            Remove-Item "installer\payload\x86" -Recurse -Force -ErrorAction SilentlyContinue
          }

          # 配置文件
          Copy-Item "installer\JCUT-教育网.ovpn" "installer\payload\config\" -Force
          "haveX86=$haveX86" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ---------------- 4. 编译安装包 ----------------
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Provide Simplified Chinese language file (best-effort)
        shell: pwsh
        run: |
          $target = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (-not (Test-Path $target)) {
            try {
              Invoke-WebRequest "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/main/ChineseSimplified.isl" -OutFile $target -ErrorAction Stop
              Write-Host "[OK] 已放入简体中文语言文件"
            } catch { Write-Warning "中文语言文件下载失败,编译时会自动回退英文" }
          }

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/v','' } else { '0.0.0-dev' }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $a = @("/DAppVer=$ver", "/DServiceArgs=${{ steps.svc.outputs.args }}", "installer\installer.iss")
          if ("${{ steps.assemble.outputs.haveX86 }}" -eq "true") { $a = @("/DHaveX86=1") + $a }
          & $iscc @a
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "编译失败(可能中文语言文件不兼容),回退英文界面后重试"
            (Get-Content installer\installer.iss) -replace 'compiler:Languages\\ChineseSimplified\.isl', 'compiler:Default.isl' | Set-Content installer\installer.iss
            & $iscc @a
            if ($LASTEXITCODE -ne 0) { throw "Inno 编译仍然失败" }
          }

      # ---------------- 5. 冒烟测试 ----------------
      - name: Smoke test (silent install / uninstall)
        shell: pwsh
        run: |
          # 清理 runner 镜像上可能残留的官方 OpenVPN,避免与待测安装包冲突(没装也忽略)
          choco uninstall openvpn -y --no-progress 2>$null; $null = $null
          $exe = Get-ChildItem "installer\Output\*.exe" | Select-Object -First 1
          Start-Process $exe.FullName "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          if (-not (Test-Path "C:\Program Files\JCUTVPN\bin\openvpn.exe")) { throw "安装校验失败:缺 openvpn.exe" }
          if (-not (Test-Path "C:\Program Files\JCUTVPN\config\JCUT-教育网.ovpn")) { throw "安装校验失败:缺配置" }
          # 校验注册表:exe_path 命名值 + 默认值 @(GUI 读默认值作 install_path)
          $r = reg query "HKLM\Software\OpenVPN" /v exe_path /reg:64 2>$null
          if (-not $r) { throw "注册表校验失败:64 位视图下未找到 HKLM\Software\OpenVPN\exe_path" }
          $d = reg query "HKLM\Software\OpenVPN" /ve /reg:64 2>$null
          if (-not ($d -match 'REG_SZ')) { throw "注册表校验失败:HKLM\Software\OpenVPN 默认值 @(install_path) 未写入或非 REG_SZ" }
          # 校验交互服务名 = OpenVPNServiceInteractive(GUI 硬编码查这个名)
          $svc = (Get-Service -Name OpenVPNServiceInteractive -ErrorAction SilentlyContinue)
          if (-not $svc) { throw "服务校验失败:未找到 OpenVPNServiceInteractive(GUI 会提示未安装)" }
          Write-Host "[OK] 安装 + 注册表(exe_path/默认值)+ 服务名校验通过"
          $unins = "C:\Program Files\JCUTVPN\unins000.exe"
          if (Test-Path $unins) { Start-Process $unins "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait }

      # ---------------- 6. 产物 ----------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JCUTVPN-Setup
          path: installer\Output\*.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Output\*.exe
